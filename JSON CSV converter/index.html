<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSV ↔ JSON Converter</title>
  <link rel="icon" href="https://www.dreamstime.com/data-transfer-symbol-circular-arrows-around-document-icon-file-management-processing-depicts-two-documents-forming-image388238230" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>CSV ↔ JSON</h1>

    <div class="mode-bar">
      <span id="modeLabel" class="badge">CSV → JSON</span>
      <button id="toggleModeBtn" class="btn btn-ghost">Switch</button>
    </div>

    <div id="dropZone" class="drop-zone">
      <div class="drop-title">Drag & drop a file here</div>
      <div class="drop-sub">or click to select a file</div>
    </div>

    <input type="file" id="fileInput" hidden />

    <div class="panel">
      <label class="label">Input</label>
      <textarea id="inputArea" placeholder="Paste CSV or JSON here..."></textarea>
    </div>

    <button id="convertBtn" class="btn btn-primary">Convert</button>

    <div class="panel">
      <label class="label">Output</label>
      <textarea id="outputArea" placeholder="Output will appear here..." readonly></textarea>

      <div class="output-actions">
        <button id="copyBtn" class="btn btn-copy">Copy</button>
        <button id="downloadBtn" class="btn btn-download">Download</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
