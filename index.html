<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSV ↔ JSON Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CSV ↔ JSON Converter</h1>

  <!-- CSV to JSON -->
  <section>
    <h2>CSV to JSON</h2>

    <input type="file" id="csvFile" accept=".csv">
    <br><br>

    <textarea id="csvInput" placeholder="Paste CSV here..."></textarea>
    <br>

    <button onclick="convertCSVtoJSON()">Convert</button>

    <textarea id="jsonOutput" placeholder="JSON output..." readonly></textarea>
    <br>

    <button onclick="downloadJSON()">Download JSON</button>
  </section>

  <hr>

  <!-- JSON to CSV -->
  <section>
    <h2>JSON to CSV</h2>

    <input type="file" id="jsonFile" accept=".json">
    <br><br>

    <textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>
    <br>

    <button onclick="convertJSONtoCSV()">Convert</button>

    <textarea id="csvOutput" placeholder="CSV output..." readonly></textarea>
    <br>

    <button onclick="downloadCSV()">Download CSV</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
